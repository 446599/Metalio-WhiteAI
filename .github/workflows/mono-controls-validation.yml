name: Mono controls validation
on:
  push:
    branches: [codex/mono-controls]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: mono-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply checksum-verified source changes
        run: python3 .ci/apply-mono.py
      - uses: actions/upload-artifact@v4
        with:
          name: mono-overlay
          path: mono-overlay.zip
          retention-days: 3
  host:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mono-overlay
      - run: unzip -o mono-overlay.zip
      - uses: actions/checkout@v4
        with:
          repository: DaveGamble/cJSON
          ref: v1.7.19
          path: managed_components/espressif__cjson/cJSON
          persist-credentials: false
      - run: python3 -m pip install Pillow
      - name: Monochrome controls and all existing regressions
        run: |
          mkdir -p validation
          failed=0
          for t in tools/check_mono_controls.py tools/check_input_network.py tools/check_ssid_store.py tools/check_ui_contract.py tools/check_ai_contract.py tools/check_dashboard_contract.py tools/check_reminders_contract.py tools/check_system_tools.py tools/check_memory_contract.py tools/check_input_transport.py tools/check_volume_callbacks.py tools/check_serial_write.py tools/check_recorder.py tools/check_refresh_policy.py tools/check_reminder_chime.py; do
            python3 "$t" > "validation/$(basename "$t").log" 2>&1 || failed=1
            tail -n 12 "validation/$(basename "$t").log"
          done
          exit "$failed"
      - name: Render actual C++ pages with real repository fonts
        if: always()
        run: |
          mkdir -p validation
          python3 tools/render_ui_preview.py --out build/mono-preview > validation/render.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mono-host-validation
          path: |
            validation/
            build/mono-preview/**/*.png
          retention-days: 7
  firmware:
    needs: prepare
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mono-overlay
      - name: Restore tested source overlay
        run: python3 -m zipfile -e mono-overlay.zip .
      - name: Full ESP32-S3 build and delivery validation
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py build 2>&1 | tee firmware-build.log
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mono-build-validation
          path: |
            firmware-build.log
            build/delivery_manifest.json
          retention-days: 7
  publish:
    needs: [host, firmware]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mono-controls
          fetch-depth: 2
      - name: Check branch has not moved
        run: test "$(git rev-parse HEAD)" = '${{ github.sha }}'
      - uses: actions/download-artifact@v4
        with:
          name: mono-overlay
      - name: Commit only validated source, on isolated branch
        run: |
          unzip -o mono-overlay.zip
          git add main tools docs
          git diff --cached --check
          git config user.name 'WhiteAI validation'
          git config user.email '116695909+446599@users.noreply.github.com'
          git commit -m 'feat: native monochrome font, working pages and pull-down controls [skip ci]' -m 'Host regressions, actual framebuffer previews and complete ESP-IDF 6.0.1 build passed. Physical radio/display/SD/power behavior not validated.'
          git push origin HEAD:codex/mono-controls
