name: Mono controls validation
on:
  push:
    branches: [codex/mono-controls]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DaveGamble/cJSON
          ref: v1.7.19
          path: managed_components/espressif__cjson/cJSON
          persist-credentials: false
      - name: Source inspection bundle (no font assets, firmware or credentials)
        shell: python
        run: |
          import pathlib, zipfile, subprocess
          with zipfile.ZipFile('mono-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
              p=pathlib.Path(name)
              if p.suffix in ('.c','.cc','.h','.hpp','.py','.md','.yml','.txt','.inc','.csv') or name in ('sdkconfig','sdkconfig.defaults','dependencies.lock'):
                if p.name=='ai_ui_assets.c' or p.stat().st_size>400000:
                  continue
                z.write(p,name)
            for name in ('cJSON.c','cJSON.h'):
              p=pathlib.Path('managed_components/espressif__cjson/cJSON')/name
              z.write(p,str(p))
      - uses: actions/upload-artifact@v4
        with:
          name: mono-sources
          path: mono-sources.zip
          retention-days: 2
      - name: Baseline host contracts
        run: |
          mkdir -p validation
          failed=0
          for t in tools/check_input_network.py tools/check_ssid_store.py tools/check_ui_contract.py tools/check_ai_contract.py tools/check_dashboard_contract.py tools/check_reminders_contract.py tools/check_system_tools.py tools/check_memory_contract.py tools/check_input_transport.py tools/check_volume_callbacks.py tools/check_serial_write.py tools/check_recorder.py tools/check_refresh_policy.py tools/check_reminder_chime.py; do
            python3 "$t" > "validation/$(basename "$t").log" 2>&1 || failed=1
            tail -n 8 "validation/$(basename "$t").log"
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mono-baseline
          path: validation/
          retention-days: 2
