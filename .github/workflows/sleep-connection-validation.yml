name: Sleep and connection validation
on:
  push:
    branches: [codex/sleep-connection]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for validation
        run: git archive --format=zip HEAD > sleep-sources.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sleep-sources
          path: sleep-sources.zip
          retention-days: 1
