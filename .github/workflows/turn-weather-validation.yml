name: Turn recovery and weather validation
on:
  push:
    branches: [codex/turn-weather]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked repository for local validation
        run: git archive --format=zip --output=turn-weather-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: turn-weather-source
          path: turn-weather-source.zip
          retention-days: 1
