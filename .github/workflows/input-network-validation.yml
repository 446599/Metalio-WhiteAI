name: Input and network validation
on:
  workflow_dispatch:
  push:
    branches: [codex/ai-reader-home]
    paths:
      - 'main/**'
      - 'components/**'
      - 'tools/**'
      - 'assets/**'
      - 'partitions/**'
      - 'sdkconfig*'
      - 'dependencies.lock'
      - 'CMakeLists.txt'
      - '.github/workflows/input-network-validation.yml'
  pull_request:
    branches: [codex/ai-reader-home]
    paths:
      - 'main/**'
      - 'components/**'
      - 'tools/**'
      - 'assets/**'
      - 'partitions/**'
      - 'sdkconfig*'
      - 'dependencies.lock'
      - 'CMakeLists.txt'
      - '.github/workflows/input-network-validation.yml'
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: input-network-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DaveGamble/cJSON
          ref: v1.7.19
          path: managed_components/espressif__cjson/cJSON
          persist-credentials: false
      - run: python3 -m pip install Pillow
      - name: Input, monochrome controls and existing behavior regressions
        run: |
          mkdir -p validation
          failed=0
          for test in tools/check_audio_playback.py tools/check_mono_controls.py tools/check_input_network.py tools/check_ssid_store.py tools/check_ui_contract.py tools/check_ai_contract.py tools/check_dashboard_contract.py tools/check_reminders_contract.py tools/check_system_tools.py tools/check_memory_contract.py tools/check_input_transport.py tools/check_volume_callbacks.py tools/check_serial_write.py tools/check_recorder.py tools/check_refresh_policy.py tools/check_reminder_chime.py; do
            python3 "$test" > "validation/$(basename "$test").log" 2>&1 || failed=1
            tail -n 20 "validation/$(basename "$test").log"
          done
          exit "$failed"
      - name: Experimental BLE mock contract (not a product radio test)
        run: WHITEAI_TEST_BLE=1 python3 tools/check_mono_controls.py
      - name: Actual firmware rendering and input routing
        if: always()
        run: |
          mkdir -p validation
          python3 tools/render_ui_preview.py --out build/ui-input-preview > validation/render.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-network-host-validation
          path: |
            validation/
            build/ui-input-preview/**/*.png
          retention-days: 7
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile complete ESP32-S3 firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py build 2>&1 | tee firmware-build.log
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-network-build-log
          path: |
            firmware-build.log
            build/delivery_manifest.json
            build/audio_memory.json
          retention-days: 7
