name: Publish verified audio repair
on:
  push:
    branches: [codex/fix-audio-ram]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: audio-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-audio-ram
      - name: Verify tested run and unchanged branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          gh api repos/446599/Metalio-WhiteAI/actions/runs/35680222813/jobs --jq '.jobs | map({key:.name,value:.conclusion}) | from_entries' > checked-jobs.json
          python3 -c "import json; jobs=json.load(open('checked-jobs.json')); assert all(jobs.get(n)=='success' for n in ('prepare','host','baseline','firmware')); print('All source/build tests passed; retry only publication')"
      - uses: actions/download-artifact@v4
        with:
          name: audio-overlay
          run-id: 35680222813
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: audio-baseline
          run-id: 35680222813
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence-baseline
      - uses: actions/download-artifact@v4
        with:
          name: audio-build-validation
          run-id: 35680222813
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence-fixed
      - name: Verify exact source and memory evidence
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,zipfile
          a=json.loads(Path('evidence-baseline/baseline-budget.json').read_text())
          b=json.loads(next(Path('evidence-fixed').rglob('audio_memory.json')).read_text())
          assert a['forbidden_ble_symbols'] and not b['errors'] and not b['forbidden_ble_symbols']
          gain=a['internal_static_bytes']-b['internal_static_bytes']
          assert gain==20108
          hashes=json.loads(Path('audio-hashes.json').read_text())
          assert len(hashes)==23
          with zipfile.ZipFile('audio-overlay.zip') as z:
            assert set(z.namelist())==set(hashes)
            for name,expected in hashes.items():
              data=z.read(name)
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==expected,name
              assert not Path(name).is_absolute() and '..' not in Path(name).parts
              if name.startswith('.github/'):
                continue
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          d=Path('docs/AUDIO_MEMORY_FIX_20260922.md')
          with d.open('a') as f:
            f.write('\n## CI 实际构建结果\n\n')
            f.write('验证运行：https://github.com/446599/Metalio-WhiteAI/actions/runs/35680222813\n\n')
            f.write(f"同环境对照：故障版本内部静态 {a['internal_static_bytes']} 字节，修复版 {b['internal_static_bytes']} 字节，减少 {gain} 字节；IRAM 总占用分别 {a['iram_bytes']} / {b['iram_bytes']} 字节。修复 ELF 未链接受检 BLE 入口，故障版被新增检查实际拒绝。\n\n")
            f.write('上述静态统计包含 vectors 和 text_end 对齐段，排除重复的 .dram0.dummy 别名；与交接文档的正文代码统计口径有小额差异。IRAM .text 从 107351 降至 88727 字节，与交接所列旧版有声代码大小一致，不等同于实测动态堆。\n\n')
            f.write('16 组主机检查通过，包括 11 个生产播放循环分支场景及 10 项 ELF 检查单测；默认控制/阅读检查 4406 次 CHECK，实验 BLE mock 4408 次，输入/联网 3176 次，记忆 504 次。硬件、RTOS、编解码/I2S 均按测试用途模拟。实际字体绘图和输入路由生成 5 组各 89 帧，共 445 帧（另有 5 张总览），通过缺字和越界检查。\n\n')
            f.write('完整 ESP-IDF 6.0.1 构建 1398 个步骤通过，应用 3142768 字节（0x2ff470），5 MiB 应用槽剩余约 40%；字体和分区表哈希保持不变。build/audio_memory.json 由构建实际校验生成。以上不是实体音频验收，未测修复后运行时最大连续块或实际 TTS 峰值。\n\n')
            f.write('验证运行中的 prepare/host/baseline/firmware 均成功；首次 publish 因 Actions token 无工作流写权限而失败。产品源文件由本次独立发布步骤按原产物哈希确认提交；常规工作流配置由仓库连接单独写入，没有修改已通过测试的产品代码，也没有关闭检查。\n')
      - name: Commit only product source and evidence
        run: |
          while IFS= read -r path; do
            case "$path" in .github/*) continue;; esac
            git add -- "$path"
          done < audio-paths.txt
          test "$(git diff --cached --name-only | wc -l)" -eq 22
          git diff --cached --check
          git config user.name 'WhiteAI validation'
          git config user.email '116695909+446599@users.noreply.github.com'
          git commit -m 'fix(audio): reclaim BLE IRAM and validate playback memory [skip ci]' -m 'Product source verified against successful host/ELF/baseline/build jobs in 35680222813. Recover 20108 static internal bytes without reducing audio stacks. Real hardware audio still needs validation.'
          git push origin HEAD:codex/fix-audio-ram
